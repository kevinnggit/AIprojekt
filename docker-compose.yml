services:
  vue-frontend:
    build:
      context: ./vue-frontend
      dockerfile: Dockerfile
      args:
        VITE_JAVA_API_URL: ${VITE_JAVA_API_URL}
        VITE_PYTHON_API_URL: ${VITE_PYTHON_API_URL}
    #container_name: nspace-frontend
    container_name: nspace-frontend
    ports:
      - "${FRONTEND_PORT}:80"
      #- "3000:80"
    depends_on:
      - java-backend
      - python-backend
    networks:
      - app-network
    # environment:
    # - VITE_JAVA_API_URL=http://java-backend:8080
    # - VITE_PYTHON_API_URL=http://python-backend:8000

  java-backend:
    build:
      context: ./java-backend
      dockerfile: Dockerfile
    container_name: nspace-java
    ports:
      - "${JAVA_PORT}:8080"
      #- "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      #- SPRING_PROFILES_ACTIVE=docker
      SERVER_PORT: 8080
      #- SERVER_PORT=8080
      # Database Config
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${JAVA_DB_USER}
      DB_PASSWORD: ${JAVA_DB_PASSWORD}
      DB_NAME: ${JAVA_DB_NAME}
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - postgres
    networks:
      - app-network
    volumes:
      - ./logs:/app/logs

  python-backend:
    build:
      context: ./python-backend
      dockerfile: Dockerfile
    container_name: nspace-python
    ports:
      - "${PYTHON_PORT}:8000"
      #- "8000:8000"
    environment:
      PYTHONPATH: /app
      PYTHONUNBUFFERED: "1"
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      SYSTEM_PROMPT: ${SYSTEM_PROMPT}
      # Database Config
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_USER: ${PYTHON_DB_USER}
      DB_PASSWORD: ${PYTHON_DB_PASSWORD}
      DB_NAME: ${PYTHON_DB_NAME}
    depends_on:
      - postgres
    networks:
      - app-network
    volumes:
      - ./logs:/app/logs

  postgres:
    image: postgres:15-alpine
    container_name: nspace-postgres
    ports:
      - "${DB_PORT}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB} # Default maintenance DB
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - app-network

networks:
  app-network:


volumes:
  postgres_data:
